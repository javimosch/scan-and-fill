services:
  app:
    platform: linux/arm64
    image: javimosch/scanfillweb:latest-arm64
    container_name: scanfillweb
    restart: unless-stopped
    ports:
      - '3087:3000'
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    env_file:
      - .env.rbm
    environment:
      - PORT=3000
      - NODE_ENV=production
      - RATE_LIMIT_WINDOW_MS=600000
      - RATE_LIMIT_MAX=60
